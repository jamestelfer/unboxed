name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Tests run on Linux only. Releases still build for macOS and Windows, so
    # the cross-platform rules in AGENTS.md apply without CI coverage.
    # The name matches the required status check in the repository ruleset.
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true
          install_args: go just golangci-lint

      # No go-version/go-version-file: setup-go then installs nothing and only
      # wires the module and build caches around the toolchain mise put on PATH.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache-dependency-path: go.sum

      - name: Build
        run: just build

      - name: Run tests
        run: just test

      - name: Run race detector
        run: go test -race ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true
          install_args: go just golangci-lint

      # .golangci.yaml carries no Go dependencies; it is here only to fork this
      # key from the test job's, which would otherwise win the race to save.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache-dependency-path: |
            go.sum
            .golangci.yaml

      # install-mode: none resolves golangci-lint off PATH, leaving mise the
      # version owner and this action just its cache and problem matchers.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          install-mode: none
